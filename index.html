<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pàngdá học HSK – Tiếng Trung HSK 3.0</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐼</text></svg>" />
    <script>
      // Đặt theme & chế độ sáng/tối TRƯỚC khi render để không nhấp nháy màu.
      (function () {
        var t = 'nature', m = 'system';
        try {
          t = localStorage.getItem('pangda.theme') || t;
          m = localStorage.getItem('pangda.mode') || m;
        } catch (e) {}
        var dark = m === 'dark' || (m === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        r.setAttribute('data-theme', t);
        r.setAttribute('data-mode', dark ? 'dark' : 'light');
        r.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
