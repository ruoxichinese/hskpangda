<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" role="img" aria-label="Cụng ly" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif"><rect width="600" height="390" rx="24" fill="#FFFDF7"/><text x="300" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#1F2937">Cụng ly: miệng ly người dưới thấp hơn (碰杯)</text><path d="M220,95 L296,95 L286,215 L230,215 Z" fill="#FBD38D" opacity=".85" stroke="#4A5568" stroke-width="3"/><rect x="226" y="215" width="64" height="12" rx="4" fill="#4A5568"/><line x1="198" y1="95" x2="318" y2="95" stroke="#C53030" stroke-width="2" stroke-dasharray="6 4"/><text x="188" y="265" text-anchor="middle" font-size="16" font-weight="800" fill="#1F2937">Cấp trên / khách</text><text x="188" y="285" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280">miệng ly cao hơn</text><path d="M304,135 L380,135 L370,255 L314,255 Z" fill="#C6F6D5" opacity=".85" stroke="#4A5568" stroke-width="3"/><rect x="310" y="255" width="64" height="12" rx="4" fill="#4A5568"/><line x1="282" y1="135" x2="402" y2="135" stroke="#C53030" stroke-width="2" stroke-dasharray="6 4"/><text x="412" y="305" text-anchor="middle" font-size="16" font-weight="800" fill="#1F2937">Bạn (cấp dưới)</text><text x="412" y="325" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280">miệng ly thấp hơn, cầm hai tay</text><text x="300" y="88" text-anchor="middle" font-size="18" font-weight="800" fill="#D69E2E">✨ cạch!</text><text x="300" y="365" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Câu mời: “……我敬您一杯。我干了，您随意。”</text></svg>