<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-label="Chủ nhà tự lái: khách quan trọng ngồi ghế phụ" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif"><rect width="640" height="600" rx="24" fill="#FFFDF7"/><text x="320" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#1F2937">Chủ nhà tự lái: khách quan trọng ngồi ghế phụ</text><text x="320" y="64" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280">(nhìn từ trên xuống · xe Trung Quốc tay lái bên trái)</text><rect x="170" y="90" width="260" height="440" rx="70" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3"/><rect x="195" y="120" width="210" height="70" rx="26" fill="#BEE3F8" opacity=".8"/><text x="300" y="162" text-anchor="middle" font-size="14" font-weight="400" fill="#6B7280">↑ đầu xe</text><rect x="195" y="455" width="210" height="45" rx="20" fill="#BEE3F8" opacity=".6"/><circle cx="245" cy="255" r="24" fill="#D69E2E" stroke="#fff" stroke-width="3"/><text x="245" y="263" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">🚘</text><text x="135" y="263" text-anchor="end" font-size="15" font-weight="700" fill="#1F2937">Chủ nhà lái</text><circle cx="355" cy="255" r="24" fill="#C53030" stroke="#fff" stroke-width="3"/><text x="355" y="263" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">①</text><text x="465" y="263" text-anchor="start" font-size="15" font-weight="700" fill="#1F2937">Ghế phụ</text><text x="465" y="281" text-anchor="start" font-size="13" fill="#6B7280">khách quan trọng nhất</text><circle cx="225" cy="390" r="24" fill="#90CDF4" stroke="#fff" stroke-width="3"/><text x="225" y="398" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">③</text><text x="135" y="398" text-anchor="end" font-size="15" font-weight="700" fill="#1F2937">Ghế sau trái</text><circle cx="300" cy="390" r="24" fill="#BEE3F8" stroke="#fff" stroke-width="3"/><text x="300" y="398" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">④</text><text x="300" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Ghế sau giữa</text><circle cx="375" cy="390" r="24" fill="#2B6CB0" stroke="#fff" stroke-width="3"/><text x="375" y="398" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">②</text><text x="465" y="398" text-anchor="start" font-size="15" font-weight="700" fill="#1F2937">Ghế sau phải</text><circle cx="245" cy="215" r="14" fill="none" stroke="#475569" stroke-width="4"/><text x="320" y="575" text-anchor="middle" font-size="13" font-weight="400" fill="#1F2937">Khách ngồi cạnh để trò chuyện với người lái là phép lịch sự · ②③④: thông lệ phổ biến</text></svg>