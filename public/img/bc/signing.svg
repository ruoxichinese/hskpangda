<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 445" role="img" aria-label="Trình tự lễ ký hợp đồng" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif"><rect width="660" height="445" rx="24" fill="#FFFDF7"/><text x="330" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#1F2937">Trình tự lễ ký hợp đồng (签约仪式)</text><rect x="30" y="110" width="180" height="110" rx="18" fill="#FEFCBF" stroke="#D69E2E" stroke-width="2"/><circle cx="50" cy="128" r="16" fill="#C53030"/><text x="50" y="134" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">1</text><text x="120" y="165" text-anchor="middle" font-size="30" font-weight="400" fill="#1F2937">🤝</text><text x="120" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Giới thiệu hai bên</text><rect x="240" y="110" width="180" height="110" rx="18" fill="#FEFCBF" stroke="#D69E2E" stroke-width="2"/><circle cx="260" cy="128" r="16" fill="#C53030"/><text x="260" y="134" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">2</text><text x="330" y="165" text-anchor="middle" font-size="30" font-weight="400" fill="#1F2937">✍️</text><text x="330" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Ký tên</text><rect x="450" y="110" width="180" height="110" rx="18" fill="#FEFCBF" stroke="#D69E2E" stroke-width="2"/><circle cx="470" cy="128" r="16" fill="#C53030"/><text x="470" y="134" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">3</text><text x="540" y="165" text-anchor="middle" font-size="30" font-weight="400" fill="#1F2937">🔴</text><text x="540" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Đóng dấu 公章</text><rect x="30" y="260" width="180" height="110" rx="18" fill="#FEFCBF" stroke="#D69E2E" stroke-width="2"/><circle cx="50" cy="278" r="16" fill="#C53030"/><text x="50" y="284" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">4</text><text x="120" y="315" text-anchor="middle" font-size="30" font-weight="400" fill="#1F2937">📑</text><text x="120" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Trao đổi văn bản</text><rect x="240" y="260" width="180" height="110" rx="18" fill="#FEFCBF" stroke="#D69E2E" stroke-width="2"/><circle cx="260" cy="278" r="16" fill="#C53030"/><text x="260" y="284" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">5</text><text x="330" y="315" text-anchor="middle" font-size="30" font-weight="400" fill="#1F2937">📸</text><text x="330" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Bắt tay, chụp ảnh</text><rect x="450" y="260" width="180" height="110" rx="18" fill="#FEFCBF" stroke="#D69E2E" stroke-width="2"/><circle cx="470" cy="278" r="16" fill="#C53030"/><text x="470" y="284" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">6</text><text x="540" y="315" text-anchor="middle" font-size="30" font-weight="400" fill="#1F2937">🥂</text><text x="540" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Nâng ly chúc mừng</text><text x="330" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">Con dấu công ty (公章) có giá trị pháp lý rất lớn, đôi khi nặng hơn chữ ký cá nhân.</text></svg>