<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 425" role="img" aria-label="Trao danh thiếp" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif"><rect width="600" height="425" rx="24" fill="#FFFDF7"/><text x="300" y="40" text-anchor="middle" font-size="19" font-weight="800" fill="#1F2937">Trao danh thiếp: hai tay, chữ quay về phía người nhận</text><rect x="200" y="120" width="200" height="118" rx="10" fill="#fff" stroke="#2D3748" stroke-width="3"/><text x="300" y="168" text-anchor="middle" font-size="26" font-weight="800" fill="#1F2937">阮文安</text><text x="300" y="196" text-anchor="middle" font-size="14" font-weight="400" fill="#6B7280">东盛集团 · 市场部</text><text x="300" y="220" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280">Andy Nguyen</text><path d="M200,240 q-40,-8 -70,30 l-10,90 l60,0 l20,-70 z" fill="#F6C99A" stroke="#B7791F" stroke-width="2"/><ellipse cx="194" cy="226" rx="16" ry="12" fill="#F6C99A" stroke="#B7791F" stroke-width="2"/><path d="M400,240 q40,-8 70,30 l10,90 l-60,0 l-20,-70 z" fill="#F6C99A" stroke="#B7791F" stroke-width="2"/><ellipse cx="406" cy="226" rx="16" ry="12" fill="#F6C99A" stroke="#B7791F" stroke-width="2"/><text x="300" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#2F855A">↑ người nhận đứng phía này: đọc được chữ ngay</text><text x="300" y="380" text-anchor="middle" font-size="14" font-weight="400" fill="#1F2937">✔ Đứng dậy, hai tay đưa, kèm “这是我的名片，请多关照”.</text><text x="300" y="402" text-anchor="middle" font-size="14" font-weight="400" fill="#1F2937">✔ Nhận cũng bằng hai tay, đọc qua tên, chức danh rồi mới cất.</text></svg>