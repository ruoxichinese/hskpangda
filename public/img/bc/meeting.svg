</text><circle cx="420" cy="160" r="24" fill="#FC8181" stroke="#fff" stroke-width="3"/><text x="420" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">③</text><text x="420" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937"></text><circle cx="240" cy="350" r="24" fill="#63B3ED" stroke="#fff" stroke-width="3"/><text x="240" y="358" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">③</text><text x="240" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937"></text><circle cx="150" cy="160" r="24" fill="#FC8181" stroke="#fff" stroke-width="3"/><text x="150" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">④</text><text x="150" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937"></text><circle cx="510" cy="350" r="24" fill="#63B3ED" stroke="#fff" stroke-width="3"/><text x="510" y="358" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">④</text><text x="510" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937"></text><circle cx="510" cy="160" r="24" fill="#FC8181" stroke="#fff" stroke-width="3"/><text x="510" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">⑤</text><text x="510" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937"></text><circle cx="150" cy="350" r="24" fill="#63B3ED" stroke="#fff" stroke-width="3"/><text x="150" y="358" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">⑤</text><text x="150" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937"></text><rect x="270" y="480" width="120" height="14" rx="4" fill="#8B5E34"/><text x="330" y="514" text-anchor="middle" font-size="15" font-weight="800" fill="#1F2937">🚪 CỬA RA VÀO</text><text x="330" y="548" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">Hai trưởng đoàn ① ngồi chính giữa, đối diện nhau; khách ngồi phía đối diện cửa 