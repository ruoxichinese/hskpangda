<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 385" role="img" aria-label="Tiễn khách" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif"><rect width="660" height="385" rx="24" fill="#FFFDF7"/><text x="330" y="40" text-anchor="middle" font-size="19" font-weight="800" fill="#1F2937">Tiễn khách: khách càng quan trọng, tiễn càng xa (送客)</text><rect x="25" y="150" width="170" height="110" rx="18" fill="#90CDF4"/><text x="110" y="205" text-anchor="middle" font-size="34" font-weight="400" fill="#1F2937">🚪</text><text x="110" y="290" text-anchor="middle" font-size="17" font-weight="800" fill="#1F2937">Cửa phòng</text><text x="110" y="312" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280">khách thông thường</text><path d="M202,200 L238,200" stroke="#2D3748" stroke-width="4" marker-end="url(#af)"/><rect x="245" y="125" width="170" height="135" rx="18" fill="#63B3ED"/><text x="330" y="195" text-anchor="middle" font-size="34" font-weight="400" fill="#1F2937">🛗</text><text x="330" y="290" text-anchor="middle" font-size="17" font-weight="800" fill="#1F2937">Thang máy</text><text x="330" y="312" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280">khách quan trọng</text><path d="M422,200 L458,200" stroke="#2D3748" stroke-width="4" marker-end="url(#af)"/><rect x="465" y="100" width="170" height="160" rx="18" fill="#3182CE"/><text x="550" y="185" text-anchor="middle" font-size="34" font-weight="400" fill="#1F2937">🚗</text><text x="550" y="290" text-anchor="middle" font-size="17" font-weight="800" fill="#1F2937">Tận xe</text><text x="550" y="312" text-anchor="middle" font-size="13" font-weight="400" fill="#6B7280">khách rất quan trọng</text><defs><marker id="af" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2D3748"/></marker></defs><text x="330" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">Khách nói “请留步” (xin dừng bước) là phép lịch sự, chủ nhà vẫn nên tiễn thêm vài bước.</text></svg>